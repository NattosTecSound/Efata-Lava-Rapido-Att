<title>Efata Lava Rápido — Gestão</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>

<style>
:root{color-scheme:dark;--bg:#08080b;--card:#131318;--line:#2b2b34;--red:#e11d2e;--silver:#c9ccd3;--txt:#f2f2f5;--mut:#9a9aa8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--txt);font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.inp{width:100%;background:#0b0b0f;border:1px solid var(--line);border-radius:8px;padding:10px 12px;color:var(--txt);outline:none}
.inp:focus{border-color:var(--red);box-shadow:0 0 0 2px rgba(225,29,46,.25)}
.btn,.btn2{border-radius:8px;padding:10px 16px;font-weight:600;display:inline-flex;gap:8px;align-items:center;justify-content:center;cursor:pointer;color:#fff;border:1px solid transparent}
.btn{background:linear-gradient(135deg,#e11d2e,#9d0e1a)}.btn:hover{filter:brightness(1.12)}
.btn2{background:#1f1f27;border-color:var(--line);color:var(--silver)}.btn2:hover{border-color:var(--silver)}
.lbl{font-size:12px;color:var(--mut);margin-bottom:4px;display:block}
.nav{display:flex;gap:12px;align-items:center;padding:11px 14px;border-radius:8px;color:var(--silver);width:100%;text-align:left;font-weight:500}
.nav:hover{background:#1b1b22}.nav.on{background:linear-gradient(90deg,rgba(225,29,46,.28),transparent);border-left:3px solid var(--red);color:#fff}
.plate{background:#fff;border:3px solid #111;border-radius:8px;overflow:hidden;max-width:230px}
.plate>div{background:#0a3a9a;color:#fff;font-size:10px;text-align:center;font-weight:700;letter-spacing:3px;padding:1px}
.plate input,.plate span{display:block;width:100%;text-align:center;font:700 28px/1.2 "Courier New",monospace;color:#111;background:#fff;letter-spacing:4px;padding:2px;outline:none}
.paper{background:#fff;color:#16161a;border-radius:10px;padding:24px}
.paper .mut{color:#666}
.scr{scrollbar-width:thin;scrollbar-color:#e11d2e #0b0b0f}.scr::-webkit-scrollbar{width:8px}.scr::-webkit-scrollbar-thumb{background:#e11d2e;border-radius:8px}.scr::-webkit-scrollbar-track{background:#0b0b0f}
@media print{body *{visibility:hidden}#receipt,#receipt *{visibility:visible}#receipt{position:absolute;left:0;top:0;width:100%;border-radius:0}.noprint{display:none!important}}
</style>
</head>

const brl=v=>(v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const parseD=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const fmtD=s=>s.split("-").reverse().join("/");
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const dg=s=>(s||"").replace(/\D/g,"");
const mPhone=s=>{const d=dg(s).slice(0,11);return d.length>10?d.replace(/(\d{2})(\d{5})(\d{0,4})/,"($1) $2-$3"):d.length>6?d.replace(/(\d{2})(\d{4})(\d{0,4})/,"($1) $2-$3"):d.length>2?d.replace(/(\d{2})(\d*)/,"($1) $2"):d};
const mCnpj=s=>{const d=dg(s).slice(0,14);return d.replace(/^(\d{2})(\d)/,"$1.$2").replace(/^(\d{2})\.(\d{3})(\d)/,"$1.$2.$3").replace(/\.(\d{3})(\d)/,".$1/$2").replace(/(\d{4})(\d)/,"$1-$2")};
const mPlate=s=>(s||"").toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,7);
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode("efata:"+s)))].map(x=>x.toString(16).padStart(2,"0")).join("");

// ---- IndexedDB ----
const dbp=new Promise((res,rej)=>{const r=indexedDB.open("efata-lava-rapido",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const tx=async(m,f)=>{const d=await dbp;return new Promise((res,rej)=>{const t=d.transaction("kv",m);const o=f(t.objectStore("kv"));t.oncomplete=()=>res(o.result);t.onerror=()=>rej(t.error)})};
const kv={get:k=>tx("readonly",s=>s.get(k)),set:(k,v)=>tx("readwrite",s=>s.put(v,k)),del:k=>tx("readwrite",s=>s.delete(k)),orders:()=>tx("readonly",s=>s.getAll(IDBKeyRange.bound("o:","o;")))};

// ---- Compressão de imagem via canvas ----
const compress=(file,max=1000,q=.6)=>new Promise(res=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL("image/jpeg",q))};img.onerror=()=>res(null);img.src=u});

// ---- Seletor de data ----
function DatePicker({value,onChange}){
  const [open,setOpen]=useState(false);
  const [m,setM]=useState(()=>{const d=parseD(value);return new Date(d.getFullYear(),d.getMonth(),1)});
  useEffect(()=>{if(open){const d=parseD(value);setM(new Date(d.getFullYear(),d.getMonth(),1))}},[open]);
  const first=m.getDay(),days=new Date(m.getFullYear(),m.getMonth()+1,0).getDate(),cells=[...Array(first).fill(null),...Array.from({length:days},(_,i)=>i+1)];
  const nb=(f,t,c)=><button type="button" className="btn2" style={{padding:"4px 9px"}} aria-label={t} onClick={()=>setM(new Date(m.getFullYear()+f[0],m.getMonth()+f[1],1))}>{c}</button>;
  return <div className="relative"><button type="button" className="inp flex items-center justify-between text-left" onClick={()=>setOpen(!open)}><span>{fmtD(value)}</span><Icon n="cal" s={16}/></button>
    {open&&<><div className="fixed inset-0 z-30" onClick={()=>setOpen(false)}/><div className="absolute left-0 z-40 mt-1 p-3 rounded-xl" style={{width:288,background:"#1b1b22",border:"1px solid var(--line)",boxShadow:"0 10px 30px rgba(0,0,0,.6)"}}>
      <div className="flex items-center justify-between mb-2"><div className="flex gap-1">{nb([-1,0],"Ano anterior","«")}{nb([0,-1],"Mês anterior",<Icon n="left" s={14}/>)}</div><b className="capitalize text-sm">{m.toLocaleDateString("pt-BR",{month:"long",year:"numeric"})}</b><div className="flex gap-1">{nb([0,1],"Próximo mês",<Icon n="right" s={14}/>)}{nb([1,0],"Próximo ano","»")}</div></div>
      <div className="grid grid-cols-7 text-center text-[11px] mb-1" style={{color:"var(--mut)"}}>{["D","S","T","Q","Q","S","S"].map((d,i)=><div key={i}>{d}</div>)}</div>
      <div className="grid grid-cols-7 gap-1">{cells.map((d,i)=>{if(!d)return <div key={i}/>;const k=iso(new Date(m.getFullYear(),m.getMonth(),d));return <button type="button" key={i} onClick={()=>{onChange(k);setOpen(false)}} className="aspect-square rounded-md text-sm" style={{background:k===value?"var(--red)":"#0b0b0f",border:"1px solid "+(k===iso(new Date())?"var(--silver)":"transparent")}}>{d}</button>})}</div>
      <div className="flex justify-between mt-3"><button type="button" className="text-sm underline" onClick={()=>{onChange(iso(new Date()));setOpen(false)}}>Hoje</button><button type="button" className="text-sm underline" style={{color:"var(--mut)"}} onClick={()=>setOpen(false)}>Fechar</button></div></div></>}</div>;
}

// ---- Nova OS ----
function NewOrder({clients,prefill,onSave}){
  const blank=()=>({name:"",phone:"",doc:"",model:"",color:"",year:"",plate:"",date:iso(new Date())});
  const [f,setF]=useState(blank),[items,setItems]=useState([{id:uid(),name:"",value:0}]),[photos,setPhotos]=useState([]),[q,setQ]=useState(""),[busy,setBusy]=useState(false),[big,setBig]=useState(null);
  const set=(k,v)=>setF(p=>({...p,[k]:v}));
  const fill=c=>{setF(p=>({...p,name:c.name,phone:c.phone||"",doc:c.doc||"",model:c.model||"",color:c.color||"",year:c.year||"",plate:c.plate||""}));setQ("")};
  useEffect(()=>{if(prefill)fill(prefill)},[prefill]);
  const res=q.trim().length<2?[]:clients.filter(c=>(c.name+" "+c.plate).toLowerCase().includes(q.trim().toLowerCase())).slice(0,6);
  const total=items.reduce((s,i)=>s+i.value,0);
  const setItem=(id,k,v)=>setItems(p=>p.map(i=>i.id===id?{...i,[k]:v}:i));
  const addPhotos=async e=>{const files=[...e.target.files].slice(0,50-photos.length);e.target.value="";setBusy(true);const out=[];for(const fl of files){const d=await compress(fl);if(d)out.push(d)}setPhotos(p=>[...p,...out].slice(0,50));setBusy(false)};
  const submit=async()=>{
    const clean=items.filter(i=>i.name.trim());
    if(!f.name.trim())return alert("Informe o nome do cliente.");
    if(!clean.length)return alert("Adicione pelo menos um serviço com nome.");
    const o={id:uid(),...f,name:f.name.trim(),items:clean.map(({name,value})=>({name:name.trim(),value})),total:clean.reduce((s,i)=>s+i.value,0),photos,created:Date.now()};
    if(await onSave(o)){setF(blank());setItems([{id:uid(),name:"",value:0}]);setPhotos([])}
  };
  return <div className="space-y-4">
    <Title sub="Registre um atendimento novo ou busque um cliente já cadastrado.">Nova ordem de serviço</Title>
    <div className="card relative"><label className="lbl">Busca rápida por nome ou placa</label>
      <div className="relative"><span className="absolute left-3 top-3" style={{color:"var(--mut)"}}><Icon n="search"/></span><input className="inp" style={{paddingLeft:38}} placeholder="Digite o nome ou a placa..." value={q} onChange={e=>setQ(e.target.value)}/></div>
      {res.length>0&&<div className="absolute left-4 right-4 z-10 mt-1 rounded-lg overflow-hidden" style={{background:"#1b1b22",border:"1px solid var(--line)"}}>{res.map(c=><button key={c.key} onClick={()=>fill(c)} className="w-full text-left px-3 py-2 hover:bg-black/40 flex justify-between"><span>{c.name} <span style={{color:"var(--mut)"}}>— {c.model}</span></span><b>{c.plate}</b></button>)}</div>}
      {q.trim().length>=2&&!res.length&&<p className="text-sm mt-2" style={{color:"var(--mut)"}}>Nenhum cliente encontrado. Preencha os dados abaixo para cadastrar.</p>}
    </div>
    <div className="card"><h2 className="font-semibold mb-3">Cliente e veículo</h2>
      <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
        <F l="Nome completo" c="md:col-span-2"><input className="inp" value={f.name} onChange={e=>set("name",e.target.value)}/></F>
        <F l="Telefone"><input className="inp" inputMode="tel" placeholder="(11) 99999-9999" value={f.phone} onChange={e=>set("phone",mPhone(e.target.value))}/></F>
        <F l="CNH ou RG"><input className="inp" value={f.doc} onChange={e=>set("doc",e.target.value)}/></F>
        <F l="Modelo do veículo"><input className="inp" value={f.model} onChange={e=>set("model",e.target.value)}/></F>
        <F l="Cor"><input className="inp" value={f.color} onChange={e=>set("color",e.target.value)}/></F>
        <F l="Ano"><input className="inp" inputMode="numeric" maxLength={4} value={f.year} onChange={e=>set("year",dg(e.target.value))}/></F>
        <F l="Placa"><div className="plate"><div>BRASIL</div><input placeholder="ABC1D23" value={f.plate} onChange={e=>set("plate",mPlate(e.target.value))}/></div></F>
        <F l="Data do atendimento"><DatePicker value={f.date} onChange={v=>set("date",v)}/></F>
      </div></div>
    <div className="card"><div className="flex justify-between items-center mb-3"><h2 className="font-semibold">Serviços</h2><button className="btn2" onClick={()=>setItems(p=>[...p,{id:uid(),name:"",value:0}])}><Icon n="plus"/>Adicionar serviço</button></div>
      <div className="space-y-2">{items.map(i=><div key={i.id} className="flex gap-2 items-end"><F l="Serviço" c="flex-1"><input className="inp" placeholder="Ex: Lavagem simples, polimento..." value={i.name} onChange={e=>setItem(i.id,"name",e.target.value)}/></F><F l="Valor" c="w-36"><Money value={i.value} onChange={v=>setItem(i.id,"value",v)}/></F><button className="btn2" aria-label="Remover" disabled={items.length===1} onClick={()=>setItems(p=>p.filter(x=>x.id!==i.id))}><Icon n="trash"/></button></div>)}</div>
      <div className="mt-4 pt-3 flex justify-between items-center" style={{borderTop:"1px solid var(--line)"}}><span style={{color:"var(--mut)"}}>Valor total</span><b className="text-3xl" style={{color:"var(--red)"}}>{brl(total)}</b></div></div>
    <div className="card"><div className="flex justify-between items-center mb-3 flex-wrap gap-2"><h2 className="font-semibold">Fotos do serviço <span style={{color:"var(--mut)"}} className="text-sm font-normal">({photos.length}/50)</span></h2>
      <label className={"btn2 "+(photos.length>=50?"opacity-50 pointer-events-none":"")}><Icon n="img"/>{busy?"Processando...":"Selecionar fotos"}<input type="file" accept="image/*" multiple className="hidden" onChange={addPhotos}/></label></div>
      {!photos.length?<p className="text-sm" style={{color:"var(--mut)"}}>Anexe fotos do antes e depois e do estado do veículo. As imagens são comprimidas automaticamente.</p>:
      <div className="grid grid-cols-3 sm:grid-cols-5 md:grid-cols-8 gap-2">{photos.map((p,i)=><div key={i} className="relative aspect-square"><img src={p} onClick={()=>setBig(p)} className="w-full h-full object-cover rounded-lg cursor-zoom-in"/><button aria-label="Remover foto" onClick={()=>setPhotos(x=>x.filter((_,j)=>j!==i))} className="absolute top-1 right-1 rounded-full bg-black/80 p-1"><Icon n="x" s={14}/></button></div>)}</div>}</div>
    <button className="btn w-full md:w-auto text-lg" onClick={submit}><Icon n="check"/>Finalizar e gerar súmula</button>
    {big&&<Box img={big} onClose={()=>setBig(null)}/>}
  </div>;
}

// ---- PDF ----
const imgDim=s=>new Promise(r=>{const i=new Image();i.onload=()=>r([i.width,i.height]);i.onerror=()=>r([1,1]);i.src=s});
const bp=v=>brl(v).replace(/\u00a0/g," ");
async function makePdf(o,cfg){
  const d=new window.jspdf.jsPDF({unit:"mm",format:"a4"}),W=210,M=14,CW=W-2*M;let y=M;
  const chk=h=>{if(y+h>284){d.addPage();y=M}};
  const logo=cfg.cover||LOGO,[lw0,lh0]=await imgDim(logo),lh=Math.min(42,CW*lh0/lw0),lw=lh*lw0/lh0;
  d.setFillColor(0,0,0);d.rect(M,y,CW,lh,"F");d.addImage(logo,"JPEG",(W-lw)/2,y,lw,lh);y+=lh+7;
  d.setTextColor(20);d.setFont("helvetica","bold");d.setFontSize(16);d.text(cfg.name,W/2,y,{align:"center"});y+=6;
  d.setFont("helvetica","normal");d.setFontSize(10);d.setTextColor(100);if(cfg.cnpj){d.text("CNPJ "+cfg.cnpj,W/2,y,{align:"center"});y+=5}
  d.setTextColor(20);d.setFont("helvetica","bold");d.setFontSize(12);d.text("Súmula de atendimento",W/2,y+2,{align:"center"});y+=5;
  d.setDrawColor(225,29,46);d.setLineWidth(.8);d.line(M,y,W-M,y);y+=7;d.setFontSize(10);
  [["Data",fmtD(o.date)],["Cliente",o.name],["Telefone",o.phone||"-"],["CNH/RG",o.doc||"-"],["Veículo",o.model||"-"],["Cor / Ano",(o.color||"-")+" / "+(o.year||"-")]].forEach(([k,v])=>{d.setFont("helvetica","normal");d.setTextColor(100);d.text(k+":",M,y);d.setFont("helvetica","bold");d.setTextColor(20);d.text(String(v),M+26,y);y+=6});
  y+=2;d.setDrawColor(17);d.setLineWidth(.6);d.setFillColor(255,255,255);d.roundedRect(M,y,52,17,2,2,"FD");d.setFillColor(10,58,154);d.rect(M+.3,y+.3,51.4,4,"F");d.setTextColor(255);d.setFontSize(6);d.text("BRASIL",M+26,y+3.3,{align:"center"});d.setTextColor(17);d.setFont("courier","bold");d.setFontSize(18);d.text(o.plate||"-------",M+26,y+13,{align:"center"});y+=25;
  d.setFont("helvetica","bold");d.setFontSize(10);d.setTextColor(20);d.text("Serviço",M,y);d.text("Valor",W-M,y,{align:"right"});y+=2;d.setDrawColor(180);d.setLineWidth(.3);d.line(M,y,W-M,y);y+=5;d.setFont("helvetica","normal");
  o.items.forEach(i=>{const ls=d.splitTextToSize(i.name,CW-45);chk(ls.length*5+3);d.text(ls,M,y);d.text(bp(i.value),W-M,y,{align:"right"});y+=ls.length*5+2;d.setDrawColor(230);d.line(M,y-3.5,W-M,y-3.5)});
  y+=3;chk(18);d.setFillColor(17);d.rect(M,y,CW,14,"F");d.setTextColor(255);d.setFontSize(11);d.text("Valor total a pagar",M+4,y+9);d.setFontSize(15);d.setTextColor(255,71,87);d.text(bp(o.total),W-M-4,y+9.5,{align:"right"});y+=22;
  if(o.photos.length){chk(14);d.setTextColor(20);d.setFont("helvetica","bold");d.setFontSize(11);d.text("Fotos do atendimento ("+o.photos.length+")",M,y);y+=5;const g=3,s=(CW-3*g)/4;let c=0;
    for(const p of o.photos){const [w,h]=await imgDim(p);if(c===0)chk(s+g);const k=Math.min(s/w,s/h),iw=w*k,ih=h*k;d.addImage(p,"JPEG",M+c*(s+g)+(s-iw)/2,y+(s-ih)/2,iw,ih);c++;if(c===4){c=0;y+=s+g}}
    if(c)y+=s+g}
  chk(10);d.setFont("helvetica","normal");d.setFontSize(9);d.setTextColor(120);d.text("Obrigado pela preferência! - "+cfg.name,W/2,y+4,{align:"center"});
  return d.output("blob");
}

const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const printHtml=(o,cfg)=>`<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Súmula - ${esc(o.name)}</title><style>body{font-family:Arial,sans-serif;color:#16161a;margin:20px auto;max-width:780px;padding:0 12px}.logo{background:#000;text-align:center;border-radius:6px}.logo img{max-height:130px;max-width:100%}h2{text-align:center;margin:12px 0 2px}.c{text-align:center;color:#666;margin:2px 0}hr{border:0;border-top:2px solid #e11d2e;margin:12px 0}td,th{padding:7px 4px;border-bottom:1px solid #ddd;text-align:left}th:last-child,td:last-child{text-align:right}table{width:100%;border-collapse:collapse}.pl{display:inline-block;border:3px solid #111;border-radius:8px;overflow:hidden;margin:10px 0;text-align:center;width:200px}.pl i{display:block;background:#0a3a9a;color:#fff;font:700 9px Arial;letter-spacing:3px;font-style:normal}.pl b{font:700 26px 'Courier New',monospace;letter-spacing:4px}.tot{background:#111;color:#fff;padding:14px;margin-top:14px;display:flex;justify-content:space-between;align-items:center;border-radius:6px;-webkit-print-color-adjust:exact;print-color-adjust:exact}.tot b{color:#ff4757;font-size:24px}.ph{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}.ph img{width:calc(25% - 3px);aspect-ratio:1;object-fit:cover}.logo,.pl i{-webkit-print-color-adjust:exact;print-color-adjust:exact}</style></head><body><div class="logo"><img src="${cfg.cover||LOGO}"></div><h2>${esc(cfg.name)}</h2>${cfg.cnpj?`<p class="c">CNPJ ${esc(cfg.cnpj)}</p>`:""}<p class="c"><b>Súmula de atendimento</b></p><hr><p><b>Data:</b> ${fmtD(o.date)}<br><b>Cliente:</b> ${esc(o.name)}<br><b>Telefone:</b> ${esc(o.phone||"-")} &nbsp; <b>CNH/RG:</b> ${esc(o.doc||"-")}<br><b>Veículo:</b> ${esc(o.model||"-")} &nbsp; <b>Cor:</b> ${esc(o.color||"-")} &nbsp; <b>Ano:</b> ${esc(o.year||"-")}</p><div class="pl"><i>BRASIL</i><b>${esc(o.plate||"-------")}</b></div><table><tr><th>Serviço</th><th>Valor</th></tr>${o.items.map(i=>`<tr><td>${esc(i.name)}</td><td>${brl(i.value)}</td></tr>`).join("")}</table><div class="tot"><span>Valor total a pagar</span><b>${brl(o.total)}</b></div>${o.photos.length?`<p><b>Fotos do atendimento (${o.photos.length})</b></p><div class="ph">${o.photos.map(p=>`<img src="${p}">`).join("")}</div>`:""}<p class="c" style="margin-top:20px">Obrigado pela preferência! - ${esc(cfg.name)}</p><script>setTimeout(function(){window.focus();window.print()},600)<\/script></body></html>`;

// ---- Súmula ----
function OrderView({o,cfg,onBack,onDelete}){
  const [big,setBig]=useState(null),[ok,setOk]=useState(false),[pb,setPb]=useState(false),[wn,setWn]=useState(mPhone(o.phone||""));
  const printIt=()=>{let w=null;try{w=window.open("","_blank")}catch(e){}
    if(w){w.document.open();w.document.write(printHtml(o,cfg));w.document.close()}else{alert("O navegador bloqueou a janela de impressão. Vamos gerar o PDF para você imprimir a partir dele.");savePdf()}};
  const savePdf=async()=>{setPb(true);try{const blob=await makePdf(o,cfg),name=("sumula-"+o.name+"-"+o.date).normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-zA-Z0-9]+/g,"-").toLowerCase()+".pdf";let dl=null;try{dl=window.claude?await window.claude.use("downloads"):null}catch(e){}
    if(dl)await dl.save({filename:name,data:blob});else{const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove()}}catch(e){if(!(e&&e.code==="declined"))alert("Não foi possível gerar o PDF. Tente novamente.")}setPb(false)};
  const txt=`*${cfg.name}*${cfg.cnpj?"\nCNPJ: "+cfg.cnpj:""}\n\n*Súmula de atendimento*\nData: ${fmtD(o.date)}\nCliente: ${o.name}\nVeículo: ${[o.model,o.color,o.year].filter(Boolean).join(" ")}${o.plate?" — Placa "+o.plate:""}\n\n*Serviços:*\n${o.items.map(i=>`• ${i.name}: ${brl(i.value)}`).join("\n")}\n\n*Total a pagar: ${brl(o.total)}*\n\nObrigado pela preferência! 🚗✨`;
  const copy=async()=>{try{await navigator.clipboard.writeText(txt)}catch(e){const t=document.createElement("textarea");t.value=txt;document.body.appendChild(t);t.select();document.execCommand("copy");t.remove()}setOk(true);setTimeout(()=>setOk(false),2000)};
  return <div className="space-y-4">
    <div className="flex flex-wrap gap-2 noprint"><button className="btn2" onClick={onBack}><Icon n="left"/>Voltar</button><button className="btn" disabled={pb} onClick={savePdf}><Icon n="print"/>{pb?"Gerando PDF...":"Baixar PDF"}</button><button className="btn2" onClick={printIt}><Icon n="print"/>Imprimir</button><button className="btn2" onClick={copy}><Icon n={ok?"check":"msg"}/>{ok?"Copiado!":"Copiar para WhatsApp"}</button><button className="btn2 ml-auto" style={{color:"#ff6b78"}} onClick={()=>confirm("Excluir este atendimento definitivamente?")&&onDelete(o.id)}><Icon n="trash"/>Excluir</button></div>
    <div className="card noprint flex flex-wrap items-end gap-3"><F l="WhatsApp do cliente" c="flex-1 min-w-[200px]"><input className="inp" inputMode="tel" placeholder="(11) 99999-9999" value={wn} onChange={e=>setWn(mPhone(e.target.value))}/></F><a className="btn" style={dg(wn).length<10?{opacity:.4,pointerEvents:"none"}:{background:"linear-gradient(135deg,#25d366,#128c4a)"}} href={"https://wa.me/55"+dg(wn)+"?text="+encodeURIComponent(txt)} target="_blank" rel="noopener noreferrer"><Icon n="msg"/>Enviar súmula no WhatsApp</a><p className="w-full text-xs" style={{color:"var(--mut)"}}>Abre o WhatsApp (aplicativo no celular ou WhatsApp Web no computador) com o resumo da súmula pronto e o número do cliente. Para mandar o PDF, use "Baixar PDF" e anexe na conversa.</p></div>

      <div className="grid sm:grid-cols-2 gap-x-6 gap-y-1 text-sm mb-4">
        <p><span className="mut">Data:</span> <b>{fmtD(o.date)}</b></p><p><span className="mut">Cliente:</span> <b>{o.name}</b></p>
        <p><span className="mut">Telefone:</span> {o.phone||"—"}</p><p><span className="mut">CNH/RG:</span> {o.doc||"—"}</p>

      <table className="w-full text-sm"><thead><tr style={{borderBottom:"1px solid #ccc"}}><th className="text-left py-2">Serviço</th><th className="text-right py-2">Valor</th></tr></thead><tbody>{o.items.map((i,k)=><tr key={k} style={{borderBottom:"1px solid #eee"}}><td className="py-2">{i.name}</td><td className="py-2 text-right">{brl(i.value)}</td></tr>)}</tbody></table>
      <div className="flex justify-between items-center mt-4 p-4 rounded-lg" style={{background:"#111",color:"#fff"}}><span>Valor total a pagar</span><b className="text-3xl" style={{color:"#ff4757"}}>{brl(o.total)}</b></div>

      <p className="text-center mut text-xs mt-6">Obrigado pela preferência! — {cfg.name}</p>
    </div>
    {big&&<Box img={big} onClose={()=>setBig(null)}/>}
  </div>;

// ---- Clientes ----
function Clients({clients,cars,onCar,onNew}){
  const [q,setQ]=useState(""),[big,setBig]=useState(null);

// ---- Calendário ----

        return <button key={i} onClick={()=>setSel(k)} className="aspect-square rounded-lg flex flex-col items-center justify-center text-sm" style={{background:on?"var(--red)":"#0b0b0f",border:"1px solid "+(k===iso(new Date())?"var(--silver)":"var(--line)")}}>{d}{n>0&&<span className="text-[10px] font-bold px-1.5 rounded-full mt-0.5" style={{background:on?"#fff":"var(--red)",color:on?"#c00":"#fff"}}>{n} 🚗</span>}</button>})}</div></div>

// ---- Histórico ----

         <Settings key={cfg.name+cfg.cnpj} cfg={cfg} saveCfg={saveCfg}/>}
      </main></div>
    <nav className="md:hidden fixed bottom-0 inset-x-0 flex noprint z-40" style={{background:"#0d0d12",borderTop:"1px solid var(--line)",paddingBottom:"env(safe-area-inset-bottom,0px)"}}>{NAV.map(([k,i,l])=><button key={k} onClick={()=>go(k)} className="flex-1 py-2 flex flex-col items-center text-[10px] gap-0.5" style={{color:tab===k?"var(--red)":"var(--silver)"}}><Icon n={i}/>{l}</button>)}</nav>
  </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
